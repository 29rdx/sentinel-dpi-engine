name: Sentinel DPI Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev cmake g++

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Sentinel DPI Engine & Test Suite
        run: cmake --build build --config Release -j$(nproc)

      - name: Execute Automated Test Suite
        run: ./build/test_suite
