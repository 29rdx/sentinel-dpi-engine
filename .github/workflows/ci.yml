name: High-Throughput DPI Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpcap-dev
      - name: Build Engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Run Core Verification Suite
        run: |
          ./build/test_suite
      - name: Run Advanced Subsystems Test Suite
        run: |
          ./build/test_subsystems
